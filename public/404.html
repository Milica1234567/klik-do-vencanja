<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klik do venčanja</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Preserve the route,
      // query and hash while returning to the project root, where index.html
      // restores the URL before React Router starts.
      (function (location) {
        var pathSegmentsToKeep = 0;
        var projectRoot = location.pathname
          .split("/")
          .slice(0, pathSegmentsToKeep + 1)
          .join("/");
        var route = location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~");
        var query = location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "";

        location.replace(
          location.protocol +
            "//" +
            location.host +
            projectRoot +
            "/?/" +
            route +
            query +
            location.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
