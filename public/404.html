<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klik do venčanja</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Send every one of
      // them through the root document, which then locks the address to /uspomene.
      (function (location) {
        location.replace(location.protocol + "//" + location.host + "/?/uspomene");
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
