    <script>
      // Restore the original SPA URL encoded by public/404.html.
      (function (location) {
        if (location.search.startsWith("?/")) {
          var restoredUrl = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&");
            })
            .join("?");

          window.history.replaceState(
            null,
            "",
            location.pathname.slice(0, -1) + restoredUrl + location.hash,
          );
        }
      })(window.location);
    </script>
